name: CI - PartyFlow Security P0

on:
  push:
    branches: [ "main", "security-p0" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Compiler Check
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

      - name: Setup Local Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Local Supabase
        run: supabase start
        
      - name: Export Local Credentials
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r .ANON_KEY)" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r .SERVICE_ROLE_KEY)" >> $GITHUB_ENV

      - name: Run Jest Security & Integration Tests
        run: npx jest

      - name: Build Next.js
        run: npm run build
