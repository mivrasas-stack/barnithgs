name: CI - PartyFlow Security P0

on:
  push:
    branches: [ "main", "security-p0" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Compiler Check
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

      - name: Setup Local Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare Isolated Test Schema for CI
        run: |
          cp supabase/tests/fixtures/test_schema.sql supabase/migrations/00000000000000_test_schema.sql

      - name: Start Local Supabase
        run: supabase start
        
      - name: Export Local Credentials
        run: |
          supabase status -o env > supabase.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' supabase.env | cut -d '=' -f2- | tr -d '\"')" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' supabase.env | cut -d '=' -f2- | tr -d '\"')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' supabase.env | cut -d '=' -f2- | tr -d '\"')" >> $GITHUB_ENV

      - name: Run Jest Security & Integration Tests
        run: npx jest --verbose

      - name: Build Next.js
        run: npm run build
