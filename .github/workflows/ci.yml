name: CI - PartyFlow Security P0

on:
  push:
    branches: [ "main", "security-p0" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Compiler Check
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

      - name: Setup Local Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest
      
      - name: Start Local Supabase
        run: supabase start
        
      - name: Export Local Credentials
        run: |
          supabase status -o env --override-name api.url=NEXT_PUBLIC_SUPABASE_URL --override-name anon.key=NEXT_PUBLIC_SUPABASE_ANON_KEY --override-name service_role.key=SUPABASE_SERVICE_ROLE_KEY >> $GITHUB_ENV

      - name: Run Jest Security & Integration Tests
        run: npx jest

      - name: Build Next.js
        run: npm run build
