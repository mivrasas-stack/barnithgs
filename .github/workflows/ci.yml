name: CI - PartyFlow Security P0

on:
  push:
    branches: [ "main", "security-p0", "feature/p1-catalog-stage1" ]
  pull_request:
    branches: [ "main", "feature/p1-catalog-stage1" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Compiler Check
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

      - name: Setup Local Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare Isolated Test Schema for CI
        run: |
          cp supabase/tests/fixtures/test_schema.sql supabase/migrations/00000000000000_test_schema.sql

      - name: Start Local Supabase
        run: supabase start
        
      - name: Export Local Credentials
        run: |
          supabase status -o json > supabase.json
          node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync('supabase.json', 'utf8')); const env = ['NEXT_PUBLIC_SUPABASE_URL=' + data.API_URL.trim(), 'NEXT_PUBLIC_SUPABASE_ANON_KEY=' + data.ANON_KEY.trim(), 'SUPABASE_SERVICE_ROLE_KEY=' + data.SERVICE_ROLE_KEY.trim()].join('\n') + '\n'; fs.appendFileSync(process.env.GITHUB_ENV, env);"

      - name: Run Jest Security & Integration Tests
        run: |
          set -o pipefail
          npx jest --verbose --runInBand 2>&1 | tee jest-output.log

      - name: Publish Test Summary
        if: always()
        run: |
          if [ -f jest-output.log ]; then
            echo "### Jest Run Summary" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 jest-output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build Next.js
        run: npm run build
